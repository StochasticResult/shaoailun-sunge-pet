name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 构建并自检
        shell: pwsh
        run: |
          dotnet publish Windows/ShaolanPet.Windows.csproj -c Release -r win-x64 --self-contained true -o dist/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath "$PWD/dist/windows/ShaolanPet.exe" -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw "Windows 自检失败：$($test.ExitCode)" }
      - name: 测试 Windows 音频播放与自动接话
        shell: pwsh
        run: |
          $env:SHAOLAN_TEST_LOG = Join-Path $env:RUNNER_TEMP 'shaolan-playback-test.log'
          $test = Start-Process -FilePath "$PWD/dist/windows/ShaolanPet.exe" -ArgumentList '--playback-test' -PassThru -Wait
          if ($test.ExitCode -eq 2) { Write-Warning "测试机音频设备不可用，跳过真实音频播放测试" }
          elseif ($test.ExitCode -ne 0) { if (Test-Path $env:SHAOLAN_TEST_LOG) { Get-Content $env:SHAOLAN_TEST_LOG }; throw "Windows 音频联动测试失败：$($test.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ShaolanPet-Windows-x64
          path: dist/windows/
          if-no-files-found: error
